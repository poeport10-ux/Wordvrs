services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordvrs
      POSTGRES_PASSWORD: wordvrs
      POSTGRES_DB: wordvrs
    ports:
      - "5432:5432"
    volumes:
      - wordvrs_postgres_data:/var/lib/postgresql/data

volumes:
  wordvrs_postgres_data:
