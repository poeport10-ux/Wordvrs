# Builds apps/api's Docker image, pushes it to Azure Container Registry,
# and deploys it to an Azure Web App for Containers.
#
# One-time setup (see DEPLOYMENT.md for the full walkthrough):
#   1. Create the resource group, ACR, Postgres Flexible Server, App
#      Service plan, and Web App with the `az` commands in DEPLOYMENT.md.
#      If you used different resource names than the defaults there,
#      update ACR_NAME / WEBAPP_NAME below to match.
#   2. Create these repo secrets (Settings → Secrets and variables →
#      Actions):
#        AZURE_CREDENTIALS  — service principal JSON from
#          `az ad sp create-for-rbac --name wordvrs-gh-deploy --role contributor
#             --scopes /subscriptions/<sub-id>/resourceGroups/wordvrs-rg --sdk-auth`
#        ACR_USERNAME        — from `az acr credential show --name <acr-name>`
#        ACR_PASSWORD        — from the same command
#   3. Set the app's runtime config (DATABASE_URL, JWT_SECRET, CORS_ORIGINS,
#      WEBSITES_PORT) as Application Settings on the Web App itself — not
#      here. Those are deployment-target config, not build-time secrets.

name: Deploy API to Azure

on:
  push:
    branches: ["claude/wordvrs-writer-reader-apps-qxwl1l"]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

env:
  ACR_NAME: wordvrsacr
  WEBAPP_NAME: wordvrs-api
  IMAGE_NAME: wordvrs-api

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
