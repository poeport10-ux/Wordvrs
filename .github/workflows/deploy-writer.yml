name: Deploy Writer to Azure Static Web Apps

# Builds apps/writer with pnpm ourselves (skip_app_build below), then uploads
# the built dist/ folder — Azure's own Oryx build doesn't know how to build a
# pnpm workspace package on its own.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   Variables:
#     VITE_API_URL   the deployed API's URL, e.g. https://wordvrs-api.azurewebsites.net
#   Secrets:
#     AZURE_STATIC_WEB_APPS_API_TOKEN_WRITER   from the Static Web App's "Manage deployment token"

on:
  push:
    branches: [main]
    paths:
      - "apps/writer/**"
      - "packages/shared/**"
      - "packages/theme/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-writer.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Writer
        run: pnpm --filter @wordvrs/writer build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WRITER }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/writer/dist
          output_location: ""
          skip_app_build: true
