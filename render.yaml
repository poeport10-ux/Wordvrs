# Render Blueprint for WordVrs: https://render.com/docs/blueprint-spec
#
# Defines the whole stack — the shared API, both frontends, and Postgres — as
# one deploy. In the Render dashboard: New -> Blueprint -> select this repo.
# Render reads this file and provisions everything below in one go.
#
# After the first deploy, set these manually in the Render dashboard (they
# can't be known until the services exist):
#   - wordvrs-api:    CORS_ORIGINS -> the writer/reader service URLs Render assigns
#   - wordvrs-writer: VITE_API_URL -> the wordvrs-api service URL Render assigns
#   - wordvrs-reader: VITE_API_URL -> the wordvrs-api service URL Render assigns
# Then trigger a redeploy of writer/reader so the build picks up VITE_API_URL
# (Vite inlines env vars at build time, not runtime).

databases:
  - name: wordvrs-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: wordvrs-api
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @wordvrs/api prisma:generate &&
      pnpm --filter @wordvrs/api build
    startCommand: pnpm --filter @wordvrs/api exec prisma migrate deploy && pnpm --filter @wordvrs/api start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wordvrs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174

  - type: web
    name: wordvrs-writer
    runtime: static
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @wordvrs/writer build
    staticPublishPath: apps/writer/dist
    envVars:
      - key: VITE_API_URL
        value: http://localhost:4000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: wordvrs-reader
    runtime: static
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @wordvrs/reader build
    staticPublishPath: apps/reader/dist
    envVars:
      - key: VITE_API_URL
        value: http://localhost:4000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
