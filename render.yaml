# Render Blueprint for the WordVrs API.
# https://render.com/docs/blueprint-spec
#
# Deploys apps/api as a Docker web service backed by a managed Postgres
# instance. See DEPLOYMENT.md for the full setup walkthrough (custom domain,
# frontend hosting on Vercel, DNS records).

databases:
  - name: wordvrs-db
    plan: free
    databaseName: wordvrs
    user: wordvrs

services:
  - type: web
    name: wordvrs-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wordvrs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://prophetpoe.com,https://www.prophetpoe.com,https://write.prophetpoe.com
      - key: PORT
        value: 4000
